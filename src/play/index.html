<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="{{GAME_PAGE_DESCRIPTION}}" />
    <meta name="theme-color" content="#f3e8d0" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>{{GAME_PAGE_TITLE}}</title>
  </head>
  <body class="game-page">
    <a class="game-exit" href="/">{{GAME_EXIT_LABEL}}</a>
    <button id="audio-toggle" class="game-audio-toggle" type="button" aria-pressed="false"
      data-label-mute="{{GAME_MUTE_LABEL}}"
      data-label-unmute="{{GAME_UNMUTE_LABEL}}"
      data-status-muted="{{GAME_AUDIO_MUTED_STATUS}}"
      data-status-audible="{{GAME_AUDIO_AUDIBLE_STATUS}}">{{GAME_MUTE_LABEL}}</button>
    <main id="app">
      <p id="game-status" class="visually-hidden" aria-live="polite" aria-atomic="true">{{GAME_LOADING_STATUS}}</p>
      <div id="game" role="application" tabindex="-1" aria-label="{{GAME_ARIA_LABEL}}" aria-describedby="game-status"></div>
    </main>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
