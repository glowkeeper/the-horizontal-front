name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build and verify static release
        run: npm run build

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Chromium and system dependencies
        run: npm run browser:install

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/playwright/
            .artifacts/playwright-report/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  offline:
    name: Offline play
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Chromium and system dependencies
        run: npm run browser:install

      # Offline play is a charter commitment. It can only be exercised against
      # the built artefact, because the service worker and its precache do not
      # exist in the dev server the other browser tests use.
      - name: Verify offline play against the built release
        run: npm run test:offline

      - name: Upload offline failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/playwright-offline/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # Documentation about the ruleset cannot be checked from the repository
  # alone, so this asks GitHub what it actually enforces. Kept out of `Verify`
  # because the ordinary build must work without a network; kept unrequired
  # because a branch protection that blocks its own repair is a trap.
  ruleset:
    name: Ruleset matches documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Compare the documented ruleset against the live one
        run: node scripts/check-ruleset.mjs
